<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="frontier_ai: a living map of who is building what across the AI ecosystem. Drill from categories into companies into their models.">
  <title>frontier_ai · a living map of the AI ecosystem</title>
  <script>
    (function () {
      try {
        var pref = localStorage.getItem("fa-theme") || "system";
        var dark = pref === "dark" || (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.dataset.themePref = pref;
      } catch (e) { document.documentElement.dataset.theme = "light"; }
    })();
  </script>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z' fill='%234f46e5'/></svg>">
</head>
<body>
  <main class="page">

    <!-- Masthead -->
    <header class="masthead">
      <div class="masthead-lead">
        <h1 class="brand">frontier<span class="u">_ai</span><span class="caret"></span></h1>
        <p class="tagline">A living map of who is building what across the AI ecosystem.</p>
        <p class="meta-line" id="metaLine"></p>
      </div>
      <div class="masthead-right">
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle color theme" title="Theme"></button>
        <div class="tally" aria-live="polite">
          <div><span class="n" id="tallyN">0</span><span class="of" id="tallyOf"></span></div>
          <div class="lbl" id="tallyLbl">products</div>
        </div>
      </div>
    </header>

    <!-- Controls -->
    <section class="controls" aria-label="Map controls">
      <div class="controls-row top">
        <div class="segment view-toggle" id="viewSegment" role="group" aria-label="View mode">
          <button type="button" data-view="map" aria-pressed="true">Map</button>
          <button type="button" data-view="graph" aria-pressed="false">Graph</button>
        </div>
        <span class="spacer"></span>
        <div class="legend" id="priceLegend" aria-label="Pricing key"></div>
      </div>
      <div class="controls-row">
        <div class="segment" id="regionSegment" role="group" aria-label="Filter by region">
          <button type="button" data-region="all" aria-pressed="true">All regions</button>
          <button type="button" data-region="us" aria-pressed="false">US</button>
          <button type="button" data-region="china" aria-pressed="false">China</button>
          <button type="button" data-region="europe" aria-pressed="false">Europe</button>
        </div>
        <label class="sel-wrap" aria-label="Filter by pricing">
          <select id="priceSelect" class="sel">
            <option value="all">All pricing</option>
            <option value="free">Free</option>
            <option value="freemium">Freemium</option>
            <option value="paid">Paid</option>
            <option value="enterprise">Enterprise</option>
          </select>
        </label>
        <label class="sel-wrap" aria-label="Sort">
          <select id="sortSelect" class="sel">
            <option value="featured">Sort: Featured</option>
            <option value="name">Sort: A-Z</option>
            <option value="status">Sort: Status</option>
            <option value="pricing">Sort: Pricing</option>
          </select>
        </label>
        <div class="search" id="searchWrap">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="M20 20l-3.6-3.6"/></svg>
          <input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Search products and companies…" aria-label="Search">
          <button type="button" class="clear" id="searchClear" aria-label="Clear search">&#10005;</button>
        </div>
        <span class="spacer"></span>
        <span class="showing" id="showing" aria-live="polite"></span>
        <button type="button" class="reset" id="reset">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          Reset
        </button>
      </div>
    </section>

    <!-- Breadcrumb -->
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>

    <!-- Level 1: categories -->
    <div class="home" id="home"></div>

    <!-- Level 2: a category's companies and their models -->
    <div class="cat-view" id="catView" hidden></div>

    <!-- Graph mode -->
    <section id="graphView" class="graph" hidden aria-label="Ecosystem graph">
      <canvas id="graphCanvas"></canvas>
      <div class="graph-toolbar">
        <button type="button" data-g="zoomin" aria-label="Zoom in">+</button>
        <button type="button" data-g="zoomout" aria-label="Zoom out">&#8722;</button>
        <button type="button" data-g="fit" aria-label="Fit to view">&#10530;</button>
      </div>
      <div class="graph-hint">companies linked to the categories they build in &middot; click a node</div>
    </section>

    <!-- Footer -->
    <footer class="foot">
      <span id="footMeta"></span>
      <span class="spacer"></span>
      <a href="REFRESH.md">how to refresh</a>
    </footer>
  </main>

  <div class="popover" id="popover" role="dialog" aria-label="Details" hidden></div>

  <script src="data/ecosystem.js"></script>
  <script src="app.js"></script>
  <script src="graph.js"></script>
</body>
</html>
